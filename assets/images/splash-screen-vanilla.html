<!-- ====================================================
     株式会社アース 公式スプラッシュ起動画面 (Vanilla HTML/CSS/JS)
     フレームワーク不要（React/Tailwind不要）、あらゆるWebアプリ・GASで動作
     ==================================================== -->
<div id="earth-splash-screen" role="dialog" aria-label="起動中" style="
  position: fixed; inset: 0; z-index: 99999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #f7f2e7 0%, #eef6ec 50%, #e2f0df 100%);
  padding: 24px; user-select: none;
  transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
">
  <style>
    @keyframes earthSplashIn {
      0% { opacity: 0; transform: scale(0.92) translateY(12px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes earthSplashFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes earthSplashProgress {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(0%); }
      100% { transform: translateX(100%); }
    }
    .earth-splash-body {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      max-width: 320px; width: 100%;
      animation: earthSplashIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .earth-splash-symbol {
      width: 140px; height: auto; margin-bottom: 20px;
      filter: drop-shadow(0 4px 12px rgba(23, 51, 43, 0.12));
      animation: earthSplashFloat 3s ease-in-out infinite;
    }
    .earth-splash-horiz {
      height: 34px; width: auto; margin-bottom: 8px;
      filter: drop-shadow(0 2px 4px rgba(23, 51, 43, 0.08));
    }
    .earth-splash-sub {
      font-size: 12px; font-weight: 700; color: #61756d;
      letter-spacing: 0.1em; margin-bottom: 24px;
      font-family: 'Shippori Mincho', 'Hiragino Mincho ProN', serif;
    }
    .earth-splash-bar {
      width: 140px; height: 5px; background: rgba(196, 216, 206, 0.5);
      border-radius: 999px; overflow: hidden; position: relative;
    }
    .earth-splash-bar-inner {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, #247d1b, #c9933b);
      border-radius: 999px;
      animation: earthSplashProgress 1.6s ease-in-out infinite;
    }
    .earth-splash-foot {
      position: absolute; bottom: 24px;
      font-size: 10px; font-weight: 800; color: rgba(97, 117, 109, 0.7);
      letter-spacing: 0.15em; font-family: 'Manrope', sans-serif;
    }
  </style>

<script>
  window.EarthSplash = {
    start: Date.now(),
    hide: function(minWaitMs) {
      var wait = typeof minWaitMs === 'number' ? minWaitMs : 800;
      var elapsed = Date.now() - this.start;
      var delay = Math.max(0, wait - elapsed);
      setTimeout(function() {
        var el = document.getElementById('earth-splash-screen');
        if (el) {
          el.style.opacity = '0';
          el.style.pointerEvents = 'none';
          setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 650);
        }
      }, delay);
    },
    setSubtitle: function(text) {
      var sub = document.getElementById('earth-splash-subtitle');
      if (sub) sub.textContent = text;
    }
  };
  window.addEventListener('load', function() {
    window.EarthSplash.hide(800);
  });
</script>
